<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Eyebrow -->
  <text x="80" y="180" font-family="Inter, system-ui, sans-serif" font-size="22"
        letter-spacing="6" fill="#67e8f9" font-weight="500">
    DEVOPS · CLOUD · PLATFORM ENGINEERING
  </text>

  <!-- Name -->
  <text x="80" y="300" font-family="Inter, system-ui, sans-serif" font-size="92"
        font-weight="800" fill="url(#accent)">
    Gurekam Singh Bedi
  </text>

  <!-- Tagline -->
  <text x="80" y="380" font-family="Inter, system-ui, sans-serif" font-size="32"
        fill="#cbd5e1" font-weight="400">
    DevOps Engineer · 4+ years building scalable cloud
  </text>
  <text x="80" y="425" font-family="Inter, system-ui, sans-serif" font-size="32"
        fill="#cbd5e1" font-weight="400">
    infrastructure across AWS &amp; Azure.
  </text>

  <!-- Stat row -->
  <g font-family="Inter, system-ui, sans-serif" fill="#94a3b8" font-size="20">
    <g transform="translate(80, 530)">
      <text font-size="34" font-weight="700" fill="#22d3ee">99.9%</text>
      <text x="0" y="36">Uptime</text>
    </g>
    <g transform="translate(280, 530)">
      <text font-size="34" font-weight="700" fill="#22d3ee">30%</text>
      <text x="0" y="36">Cost reduction</text>
    </g>
    <g transform="translate(520, 530)">
      <text font-size="34" font-weight="700" fill="#22d3ee">70%</text>
      <text x="0" y="36">Fewer deploy fails</text>
    </g>
    <g transform="translate(800, 530)">
      <text font-size="34" font-weight="700" fill="#22d3ee">10</text>
      <text x="0" y="36">AWS accounts</text>
    </g>
  </g>

  <!-- Decorative wireframe orb -->
  <g transform="translate(990, 240)" stroke="#22d3ee" stroke-opacity="0.55" fill="none" stroke-width="1.2">
    <circle r="120"/>
    <ellipse rx="120" ry="40"/>
    <ellipse rx="40" ry="120"/>
    <ellipse rx="120" ry="80" transform="rotate(35)"/>
    <ellipse rx="120" ry="80" transform="rotate(-35)"/>
  </g>
</svg>
